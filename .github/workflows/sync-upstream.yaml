name: Sync ignis-main with upstream

on:
  schedule:
    # Run weekly on Mondays at 6:00 AM UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ignis-main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream into automation branch
        id: merge
        run: |
          BRANCH="automation/sync-upstream-main"

          git fetch origin ignis-main:refs/remotes/origin/ignis-main
          git fetch https://github.com/GStreamer/gstreamer.git main:refs/remotes/upstream/main
          git switch -C "$BRANCH" origin/ignis-main

          if git merge-base --is-ancestor refs/remotes/upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-ff --no-edit refs/remotes/upstream/main
          git push --force-with-lease origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request to ignis-main
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="automation/sync-upstream-main"

          if gh pr view "$BRANCH" --json url >/dev/null 2>&1; then
            gh pr view "$BRANCH" --json url --jq .url
          else
            gh pr create \
              --base ignis-main \
              --head "$BRANCH" \
              --title "Sync upstream GStreamer into ignis-main" \
              --body "This PR merges the latest upstream GStreamer main branch into ignis-main while preserving Ignis changes."
          fi
